proxy:
  listen_host: "127.0.0.1"
  listen_port: 8080
  fail_open: true
  max_buffer_bytes: 10485760

target:
  scheme: "https"
  host: "api.demo.example.com"
  port: 443
  methods:
    - "POST"
  paths:
    - "^/api/chatbot/ask$"
  request_content_types:
    - "application/json"
  response_content_types:
    - "application/json"

matching:
  required_request_headers:
    origin: "^https://demo-ui.example.com$"

transformation:
  enabled: true
  mode: "deterministic"
  preserve_unknown_fields: true
  transformer_version: "1.3.0"

logging:
  level: "INFO"
  log_request_bodies: false
  log_response_bodies: false
  log_match_decisions: true
  redact_headers:
    - "authorization"
    - "cookie"
    - "set-cookie"
    - "x-api-key"
    - "ocp-apim-subscription-key"

platform:
  browser_profile_name: "DemoProxyProfile"
  health_port: 8081
  pac_port: 8765
